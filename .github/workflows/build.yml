name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Cache the JUCE clone that FetchContent pulls, keyed on the pinned tag.
      - name: Cache JUCE sources
        uses: actions/cache@v6
        with:
          path: juce/build/_deps
          key: juce-deps-${{ hashFiles('juce/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S juce -B juce/build

      - name: Build
        run: cmake --build juce/build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $rel = "juce/build/Aulos_artefacts/Release"
          Copy-Item -Recurse "$rel/VST3/Aulos.vst3" "$out/Aulos.vst3"
          Copy-Item "$rel/Standalone/Aulos.exe" "$out/Aulos.exe"
          Copy-Item "README.md","LICENSE","NOTICE" $out
          Copy-Item -Recurse "licenses" "$out/licenses"
          Copy-Item -Recurse "docs" "$out/docs"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $asset = "Aulos-$ver-Windows.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aulos-Windows
          path: ${{ env.ASSET }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "$env:ASSET" --title "Aulos $env:GITHUB_REF_NAME" --generate-notes
